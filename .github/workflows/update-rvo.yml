name: Update RVO-cijfers

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test welke route wel werkt
        continue-on-error: true
        run: |
          DOEL="https://duurzamevoertuigen.databank.nl/viewer/selectiontojson.ashx?var=wp_pa_new_bev_tov_tot&lang=nl-nl"
          ENC=$(node -p "encodeURIComponent(process.argv[1])" "$DOEL")
          probeer () {
            echo "-- $1"
            curl -sS -m 30 -o /tmp/p.json -w "status %{http_code} in %{time_total}s\n" "$2" || echo "faalde"
            head -c 150 /tmp/p.json 2>/dev/null; echo; echo
          }
          probeer "allorigins" "https://api.allorigins.win/raw?url=$ENC"
          probeer "corsproxy" "https://corsproxy.io/?url=$ENC"
          probeer "codetabs" "https://api.codetabs.com/v1/proxy?quest=$ENC"

      - name: Cijfers ophalen
        run: node scrape.mjs

      - name: Wijziging vastleggen
        run: |
          if [ -n "$(git status --porcelain docs/data.json)" ]; then
            git config user.name "rvo-bot"
            git config user.email "actions@github.com"
            git add docs/data.json
            git commit -m "Cijfers bijgewerkt naar $(node -p "require('./docs/data.json').peildatum.label")"
            git push
          else
            echo "Geen wijziging."
          fi
